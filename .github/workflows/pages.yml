# Publishes Nomad to GitHub Pages as a static export (no server).
# Static version: Supabase login, PostHog, checklist, offline assistant. Voice agent needs a server (hidden).
# Only publishable, browser-side values below (Supabase publishable key is safe in public: RLS enforces access;
# PostHog project keys are write-only). Secret keys (OpenAI, Anthropic, service role) never go here.
name: Deploy to GitHub Pages

on:
  push:
    branches: [sprint-1-foundations, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_STATIC_EXPORT: "1"
      NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      NEXT_PUBLIC_SUPABASE_URL: https://tbfevbzdjitnlyscaalo.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_AMiPQp2UU2qgyK_ZB0NtFA_637NP4b4
      NEXT_PUBLIC_POSTHOG_KEY: phc_CWYcFRhjku3YW9BdtiXv2N7UQeLjtqjN82F6XG72yGJi
      NEXT_PUBLIC_POSTHOG_HOST: https://eu.i.posthog.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Server-only parts cannot be exported statically.
      - run: rm -rf app/api proxy.ts
      - run: npx next build
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
